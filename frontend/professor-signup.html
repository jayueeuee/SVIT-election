<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Professor Account</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  >
</head>

<body>

  <nav class="nav">

    <a
      class="brand"
      href="/"
    >
      <span class="crest">CE</span>
      College Election Portal
    </a>

    <div class="nav-links">

      <a href="/professor-login.html">
        Professor Login
      </a>

      <a href="/student-login.html">
        Student
      </a>

    </div>

  </nav>


  <main
    class="page"
    style="max-width: 520px;"
  >

    <section class="card">

      <p class="kicker">
        Faculty access
      </p>

      <h1>
        Create Professor Account
      </h1>

      <p class="muted">
        Create your college election administrator account.
      </p>


      <div
        id="alert"
        class="alert error hidden"
      ></div>


      <form
        id="signup-form"
        class="form-grid"
      >

        <label>
          Full Name

          <input
            type="text"
            name="name"
            required
            autocomplete="name"
            placeholder="Enter your full name"
          >
        </label>


        <label>
          Email

          <input
            type="email"
            name="email"
            required
            autocomplete="email"
            placeholder="professor@college.edu"
          >
        </label>


        <label>
          Password

          <input
            type="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Minimum 8 characters"
          >
        </label>


        <label>
          Confirm Password

          <input
            type="password"
            name="confirm_password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Re-enter your password"
          >
        </label>


        <button
          class="btn"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <p class="muted">

        Already have an account?

        <a href="/professor-login.html">
          Sign in
        </a>

      </p>

    </section>

  </main>


  <script src="/js/main.js"></script>
  <script src="/js/professor-signup.js"></script>

</body>

</html>
