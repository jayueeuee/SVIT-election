<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Your Vote</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">
      <span class="crest">CE</span>
      Ballot
    </a>
  </nav>
  <main class="page" style="max-width: 760px;">
    <section class="card">
      <p class="kicker">Select one candidate</p>
      <div id="meta"></div>
      <div id="alert" class="alert error hidden"></div>
      <form id="ballot" class="hidden"></form>
    </section>
  </main>
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <h2>Confirm your vote</h2>
      <p id="confirm-text"></p>
      <p class="muted">You cannot change this vote after submission.</p>
      <div class="row-between">
        <button class="btn ghost" type="button" id="cancel-vote">Cancel</button>
        <button class="btn" type="button" id="confirm-vote">Submit vote</button>
      </div>
    </div>
  </div>
  <script src="/js/main.js"></script>
  <script src="/js/voting.js"></script>
</body>
</html>
